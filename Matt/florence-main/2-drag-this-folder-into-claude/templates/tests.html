<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Florence — Tests</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #152823;
    --ink-2: #2A3D37;
    --ink-3: #5E6E68;
    --cream: #F4F1EA;
    --cream-2: #E9E5DA;
    --paper: #FCFAF4;
    --accent: #1FA877;
    --accent-2: #178A60;
    --green-soft: #D6F0E5;
    --gold: #D4A53A;
    --gold-soft: #F4E5BC;
    --red: #B84A3D;
    --red-soft: #F4D8D2;
    --slate: #5E6E68;
    --slate-2: #8C9A93;
    --slate-3: #B5C0BB;
    --rule: #D4D0C4;
    --rule-soft: #E2DED2;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Inter", sans-serif;
    --mono: ui-monospace, "SF Mono", "Menlo", "Cascadia Mono", "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.55; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
  em { font-style: normal; color: var(--accent); font-weight: 700; }
  strong { color: var(--ink); font-weight: 700; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 28px 56px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 24px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; gap: 24px; }
  .head-l { min-width: 0; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: var(--slate); }
  .title { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.18; margin-top: 6px; }
  .title em { color: var(--accent); }
  .meta { text-align: right; flex-shrink: 0; }
  .meta .num { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; }
  .meta .num em { color: var(--accent); }
  .meta .lbl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--slate); margin-top: 4px; }

  .h2 {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.18em; color: var(--slate);
    margin: 28px 0 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--rule-soft);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .h2 .counter { color: var(--ink); font-weight: 700; }
  .h2:first-of-type { margin-top: 0; }

  .test-list { display: flex; flex-direction: column; gap: 18px; }
  .test {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 22px 24px;
  }
  .test-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--rule-soft); }
  .test-name { font-size: 16px; font-weight: 700; letter-spacing: -0.014em; color: var(--ink); }
  .test-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; }
  .badge.kind { color: var(--ink-2); background: var(--cream-2); }
  .badge.status-running  { color: var(--gold); background: var(--gold-soft); }
  .badge.status-complete { color: var(--accent-2); background: var(--green-soft); }
  .badge.status-error    { color: var(--red); background: var(--red-soft); }

  .verdict {
    display: grid;
    grid-template-columns: minmax(200px, auto) 1fr;
    gap: 18px;
    align-items: stretch;
    margin-bottom: 16px;
  }
  .winner-card { background: var(--cream); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
  .winner-img { width: 100%; max-width: 180px; aspect-ratio: 1 / 1; object-fit: contain; background: var(--paper); border: 1px solid var(--rule-soft); border-radius: 4px; }
  .winner-img.aspect-16-9 { aspect-ratio: 16 / 9; }
  .winner-name { font-size: 13.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.012em; }
  .winner-tag { font-family: var(--mono); font-size: 10px; color: var(--accent-2); background: var(--green-soft); padding: 3px 7px; border-radius: 3px; letter-spacing: 0.1em; text-transform: uppercase; }

  .verdict-meta { display: flex; flex-direction: column; gap: 12px; }
  .verdict-headline { font-size: 15px; font-weight: 600; line-height: 1.45; color: var(--ink-2); }
  .verdict-headline strong { color: var(--ink); }
  .verdict-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { background: var(--cream); border: 1px solid var(--rule-soft); border-radius: 4px; padding: 10px 12px; }
  .stat .lbl { font-family: var(--mono); font-size: 9.5px; color: var(--slate); text-transform: uppercase; letter-spacing: 0.1em; }
  .stat .val { font-size: 16px; font-weight: 700; color: var(--ink); margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -0.015em; }
  .stat .val.up   { color: var(--accent); }
  .stat .val.down { color: var(--red); }

  .quotes { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .quote {
    border-left: 2px solid var(--accent);
    padding: 6px 0 6px 12px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-2);
    font-style: italic;
  }
  .quote .src { font-family: var(--mono); font-size: 10px; color: var(--slate-2); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; display: block; font-style: normal; }

  .recommendation {
    background: var(--green-soft);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 14px 18px;
    margin-top: 14px;
  }
  .recommendation .lead { font-family: var(--mono); font-size: 10px; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; }
  .recommendation .body { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.55; }
  .recommendation .body strong { color: var(--ink); }
  .recommendation .score { display: inline-block; font-family: var(--mono); font-size: 10.5px; color: var(--accent-2); margin-top: 6px; letter-spacing: 0.06em; }

  footer {
    margin-top: 24px;
    padding: 18px 22px;
    border: 1px solid var(--rule);
    background: var(--paper);
    border-radius: 6px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .footer-msg { font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
  .footer-msg em { color: var(--accent); font-weight: 700; }
  .footer-meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--slate); white-space: nowrap; }

  .empty-block { background: var(--paper); border: 1px dashed var(--rule); border-radius: 6px; padding: 18px 22px; color: var(--slate-2); font-size: 13px; font-style: italic; text-align: center; }
</style>
</head>
<body>

<!--
  TEMPLATE — substitute {{placeholders}} before writing to disk.
  See templates/_placeholders.md § tests.html for the full contract.
  Strip this comment before substitution.

  Quick reference (per-product Pinion test results):
    {{brand}}              "Lumen Sleep"
    {{asin}}               "B07XYZ4231"
    {{geo}}                "uk"
    {{product-title}}      Real product title
    {{test-count}}         integer (total tests in this artifact)
    {{test-lbl}}           "Tests" or "Test"
    {{tests-html}}         One <div class="test">…</div> per test block
    {{footer-msg-html}}    e.g. "<strong>What I'd do today:</strong> ship Concept #3. <em>Score 91/100.</em>"
    {{generated-at}}       "Wed 6 May · 09:14"
-->

<div class="wrap">
  <header>
    <div class="head-l">
      <div class="eyebrow">Test results · <span>{{brand}}</span></div>
      <h1 class="title">{{product-title}}</h1>
    </div>
    <div class="meta">
      <div class="num"><em>{{test-count}}</em></div>
      <div class="lbl">{{test-lbl}}</div>
    </div>
  </header>

  <div class="h2">Tests <span class="counter">{{asin}} · {{geo}}</span></div>
  <div class="test-list">
    {{tests-html}}
  </div>

  <footer>
    <div class="footer-msg">{{footer-msg-html}}</div>
    <div class="footer-meta">ProductPinion · {{generated-at}}</div>
  </footer>
</div>

</body>
</html>
