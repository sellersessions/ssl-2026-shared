<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Florence — Test log</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #152823;
    --ink-2: #2A3D37;
    --ink-3: #5E6E68;
    --cream: #F4F1EA;
    --cream-2: #E9E5DA;
    --paper: #FCFAF4;
    --accent: #1FA877;
    --accent-2: #178A60;
    --green-soft: #D6F0E5;
    --gold: #D4A53A;
    --gold-soft: #F4E5BC;
    --red: #B84A3D;
    --red-soft: #F4D8D2;
    --slate: #5E6E68;
    --slate-2: #8C9A93;
    --slate-3: #B5C0BB;
    --rule: #D4D0C4;
    --rule-soft: #E2DED2;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Inter", sans-serif;
    --mono: ui-monospace, "SF Mono", "Menlo", "Cascadia Mono", "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.55; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
  em { font-style: normal; color: var(--accent); font-weight: 700; }
  strong { color: var(--ink); font-weight: 700; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 28px 56px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 24px; border-bottom: 1px solid var(--rule); margin-bottom: 24px; gap: 24px; }
  .head-l { min-width: 0; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: var(--slate); }
  .title { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.18; margin-top: 6px; }
  .title em { color: var(--accent); }
  .meta { text-align: right; flex-shrink: 0; }
  .meta .num { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; }
  .meta .num em { color: var(--accent); }
  .meta .lbl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--slate); margin-top: 4px; }

  .session-meta {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px 16px;
    font-size: 12.5px;
  }
  .sm-row .k { font-family: var(--mono); font-size: 10px; color: var(--slate); text-transform: uppercase; letter-spacing: 0.1em; }
  .sm-row .v { color: var(--ink); font-weight: 600; margin-top: 2px; }

  .lede {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 24px;
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.55;
  }
  .lede strong { color: var(--ink); }
  .lede code { font-family: var(--mono); font-size: 12px; background: var(--cream); padding: 1px 5px; border-radius: 2px; color: var(--accent-2); }

  .h2 {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.18em; color: var(--slate);
    margin: 24px 0 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--rule-soft);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .h2 .counter { color: var(--ink); font-weight: 700; }

  .entries { display: flex; flex-direction: column; gap: 10px; }
  .entry {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 18px;
    border-left: 3px solid var(--rule);
  }
  .entry.severity-blocker { border-left-color: var(--red); }
  .entry.severity-bug     { border-left-color: var(--gold); }
  .entry.severity-nit     { border-left-color: var(--slate-3); }
  .entry.severity-praise  { border-left-color: var(--accent); }

  .entry-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .entry-num { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--slate); letter-spacing: 0.08em; }
  .entry-when { font-family: var(--mono); font-size: 10.5px; color: var(--slate); letter-spacing: 0.06em; white-space: nowrap; }
  .entry-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; }
  .badge.severity-blocker { color: var(--red); background: var(--red-soft); }
  .badge.severity-bug     { color: var(--gold); background: var(--gold-soft); }
  .badge.severity-nit     { color: var(--slate); background: var(--cream-2); }
  .badge.severity-praise  { color: var(--accent-2); background: var(--green-soft); }
  .badge.skill            { color: var(--ink-2); background: var(--cream-2); }
  .badge.artifact         { color: var(--accent-2); background: var(--green-soft); }
  .badge.asin             { color: var(--ink-2); background: var(--cream-2); }

  .entry-body { display: flex; flex-direction: column; gap: 10px; }

  .what {
    font-size: 13px;
    color: var(--slate);
    padding: 8px 12px;
    background: var(--cream);
    border-radius: 4px;
    border: 1px solid var(--rule-soft);
  }
  .what .lbl { font-family: var(--mono); font-size: 10px; color: var(--slate-2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .what .body { color: var(--ink-2); line-height: 1.5; }

  .feedback {
    border-left: 2px solid var(--accent);
    padding: 4px 0 4px 12px;
    color: var(--ink-2);
    font-size: 13.5px;
    line-height: 1.55;
    font-style: italic;
  }
  .feedback strong { color: var(--ink); }

  .repro {
    font-family: var(--mono); font-size: 11px;
    background: var(--cream);
    border: 1px solid var(--rule-soft);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--ink-2);
    line-height: 1.55;
    overflow-x: auto;
  }
  .repro .lbl { font-family: var(--mono); font-size: 10px; color: var(--slate-2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; display: block; font-weight: 600; }

  footer {
    margin-top: 28px;
    padding: 18px 22px;
    border: 1px solid var(--rule);
    background: var(--paper);
    border-radius: 6px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .footer-msg { font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
  .footer-msg em { color: var(--accent); font-weight: 700; }
  .footer-meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--slate); white-space: nowrap; }

  .empty-block { background: var(--paper); border: 1px dashed var(--rule); border-radius: 6px; padding: 18px 22px; color: var(--slate-2); font-size: 13px; font-style: italic; text-align: center; }
</style>
</head>
<body>

<!--
  TEMPLATE — substitute {{placeholders}} before writing to disk.
  See templates/_placeholders.md § test-log.html for the full contract.
  Strip this comment before substitution.

  Quick reference (test-session feedback log):
    {{session-id}}        Free-text session label
    {{tester-name}}       brain.personnel[0].name or "tester"
    {{started-at}}        First entry timestamp
    {{updated-at}}        Most recent entry timestamp
    {{entry-count}}       integer
    {{entry-lbl}}         "Entries" / "Entry"
    {{summary-counts}}    "1 blocker · 3 bugs · 2 nits · 1 praise"
    {{lede-html}}         instructions for the user — how to add entries, how to download
    {{entries-html}}      One <div class="entry severity-X">…</div> per entry
    {{footer-msg-html}}   e.g. "<strong>Download me</strong> and DM the file. Florence will read every entry in repro order."
    {{generated-at}}      ISO 8601
    {{version}}           Florence version
-->

<div class="wrap">
  <header>
    <div class="head-l">
      <div class="eyebrow">Test log · <span>{{tester-name}}</span></div>
      <h1 class="title">Florence test session</h1>
    </div>
    <div class="meta">
      <div class="num"><em>{{entry-count}}</em></div>
      <div class="lbl">{{entry-lbl}}</div>
    </div>
  </header>

  <div class="session-meta">
    <div class="sm-row"><div class="k">Session</div><div class="v">{{session-id}}</div></div>
    <div class="sm-row"><div class="k">Started</div><div class="v">{{started-at}}</div></div>
    <div class="sm-row"><div class="k">Updated</div><div class="v">{{updated-at}}</div></div>
    <div class="sm-row"><div class="k">Build</div><div class="v">{{version}}</div></div>
    <div class="sm-row"><div class="k">Counts</div><div class="v">{{summary-counts}}</div></div>
  </div>

  <div class="lede">
    {{lede-html}}
  </div>

  <div class="h2">Entries <span class="counter">{{entry-count}}</span></div>
  <div class="entries">
    {{entries-html}}
  </div>

  <footer>
    <div class="footer-msg">{{footer-msg-html}}</div>
    <div class="footer-meta">{{generated-at}}</div>
  </footer>
</div>

</body>
</html>
